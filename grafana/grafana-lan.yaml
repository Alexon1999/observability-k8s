apiVersion: v1
kind: Service
metadata:
  name: grafana-lan
  namespace: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: my-kube-prometheus-stack
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: grafana
      nodePort: 30000
